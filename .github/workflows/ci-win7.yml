name: Build pydantic-core wheel for Windows 7

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "pydantic/pydantic core tag, branch, or commit"
        required: true
        default: "core-v2.50.4"
      interpreter:
        description: "CPython version to build for; it must match the target Python minor version"
        required: true
        default: "3.12"

env:
  COLUMNS: 150
  FORCE_COLOR: 1
  CI: "1"
  RUST_TARGET: x86_64-win7-windows-msvc

jobs:
  core-build-win7:
    name: pydantic-core / Windows 7 x64 / Python ${{ inputs.interpreter }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out pydantic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pydantic/pydantic
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Set up uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ inputs.interpreter }}
          enable-cache: false

      # Win7 is a Rust Tier 3 target and has no prebuilt standard library.
      - name: Set up Rust nightly for the Win7 target
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly
          components: rust-src

      - name: Verify the Rust target
        shell: bash
        run: |
          rustc --print cfg --target "$RUST_TARGET" | grep 'target_vendor="win7"'

      - name: Verify pydantic-core version
        shell: pwsh
        run: |
          $metadata = cargo metadata `
            --format-version 1 `
            --no-deps `
            --locked `
            --quiet `
            --manifest-path pydantic-core/Cargo.toml | ConvertFrom-Json
          $core = @($metadata.packages | Where-Object name -eq "pydantic-core")

          if ($core.Count -ne 1) {
            throw "Expected exactly one pydantic-core package, found $($core.Count)."
          }

          $coreVersion = $core[0].version
          $sourceRef = "${{ inputs.version }}"
          if ($sourceRef.StartsWith("core-v")) {
            $expectedVersion = $sourceRef.Substring(6)
            if ($coreVersion -ne $expectedVersion) {
              throw "Ref '$sourceRef' contains pydantic-core $coreVersion, expected $expectedVersion."
            }
          }

          Write-Host "Building pydantic-core $coreVersion"
          "CORE_VERSION=$coreVersion" >> $env:GITHUB_ENV

      - name: Configure the CPython import library
        shell: pwsh
        run: |
          $pythonExe = (uv python find "${{ inputs.interpreter }}").Trim()
          $pythonBase = (& $pythonExe -c "import sys; print(sys.base_prefix)").Trim()
          $pythonLibDir = Join-Path $pythonBase "libs"
          $pythonAbi = "${{ inputs.interpreter }}".Replace(".", "")
          $pythonImportLib = Join-Path $pythonLibDir "python$pythonAbi.lib"

          if (-not (Test-Path -LiteralPath $pythonImportLib -PathType Leaf)) {
            throw "CPython import library was not found at '$pythonImportLib'."
          }

          Write-Host "Using CPython import library: $pythonImportLib"
          "LIB=$pythonLibDir;$env:LIB" >> $env:GITHUB_ENV

      - name: Build Windows 7 wheel
        working-directory: pydantic-core
        shell: bash
        run: |
          uvx --from maturin==1.16.0 maturin build \
            --release \
            --locked \
            --out dist \
            --interpreter "${{ inputs.interpreter }}" \
            --target "$RUST_TARGET" \
            -Z build-std=std,panic_abort
        env:
          RUSTUP_TOOLCHAIN: nightly

      - name: Verify the wheel ABI tag
        shell: pwsh
        working-directory: pydantic-core
        run: |
          $abi = "cp${{ inputs.interpreter }}".Replace(".", "")
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter *.whl)

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel in dist, found $($wheels.Count)."
          }

          $expectedSuffix = "-$abi-$abi-win_amd64.whl"
          if (-not $wheels[0].Name.EndsWith($expectedSuffix)) {
            throw "Expected a wheel ending in '$expectedSuffix', got '$($wheels[0].Name)'."
          }

          $wheels[0] | Format-Table Name,Length
          "WHEEL_PATH=$($wheels[0].FullName)" >> $env:GITHUB_ENV

      - name: Test the wheel with the matching CPython
        shell: pwsh
        working-directory: pydantic-core
        run: |
          uv venv --python "${{ inputs.interpreter }}" .wheel-test
          uv pip install --python .wheel-test/Scripts/python.exe $env:WHEEL_PATH
          & .\.wheel-test\Scripts\python.exe -c "import os, pydantic_core; from pydantic_core._pydantic_core import build_info; print(pydantic_core.__version__); print(f'{build_info=}'); assert pydantic_core.__version__ == os.environ['EXPECTED_CORE_VERSION']"
        env:
          EXPECTED_CORE_VERSION: ${{ env.CORE_VERSION }}

      - name: Upload pydantic-core wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pydantic-core-${{ env.CORE_VERSION }}-win7-x64-py${{ inputs.interpreter }}
          path: pydantic-core/dist/*.whl
          if-no-files-found: error
